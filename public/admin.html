<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin | Anant Vijay</title><link rel="stylesheet" href="style.css"></head><body class="admin">
<header><div class="brand">🎬 ANANT VIJAY — SUPER ADMIN</div><a href="index.html">User Website</a></header>
<main class="adminwrap"><section id="login" class="panel login"><h1>Super Admin Login</h1><input id="pw" type="password" placeholder="Admin password"><button id="loginBtn" type="button">Login</button><small>Set ADMIN_PASSWORD in Render environment variables before production.</small></section>
<section id="dash" class="hidden"><div class="adminhead"><div><h1>Weekly Movie Management</h1><p>Change movies here; no website redeployment is required.</p></div><button onclick="logout()" class="dark">Logout</button></div>
<div class="stats"><div><b id="total">0</b><span>Total Votes</span></div><div><b id="lead">—</b><span>Leading Movie</span></div><div><b id="openText">Open</b><span>Voting Status</span></div></div>
<section class="panel"><div class="rowbetween"><h2>Voting Control</h2><button id="toggle" onclick="toggleVoting()">Close Voting</button></div><label>Week label<input id="week" placeholder="Next Week"></label></section>
<section class="panel"><div class="rowbetween"><h2>Movies</h2><button onclick="addMovie()">+ Add Movie</button></div><div id="movieEditor"></div><button onclick="saveMovies()" class="save">Save Weekly Movies</button></section>
<section class="panel"><h2>Results</h2><div id="adminResults"></div><button onclick="resetVotes()" class="danger">Reset All Votes</button></section>
</section></main><script src="admin.js?v=2"></script></body></html>
