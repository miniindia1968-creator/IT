services:
  - type: web
    name: anant-vijay
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: anant-vijay-data
      mountPath: /var/data
      sizeGB: 1
